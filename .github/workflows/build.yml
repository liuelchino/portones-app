name: Build APK (Ofuscado y Seguro)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - run: flutter pub get
      
      # Compilar el APK con ofuscación (código ilegible) y guardar el mapa de símbolos
      - name: Compilar APK Ofuscado
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
      
      # Calcular el Hash SHA-256 para verificar integridad
      - name: Calcular Hash del APK
        run: |
          cd build/app/outputs/flutter-apk/
          sha256sum app-release.apk > app-release.apk.sha256
          
      # Subir el APK, el Hash y el archivo de símbolos
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/symbols/
